# input and output files
train_path: "../data/multi-class/amazon/train.parquet"
test_path: "../data/multi-class/amazon/test.parquet"

output_path: "../results/amazon/lql.csv"
target_column: "label" # Nome da coluna no CSV que contém a hierarquia (ex: Root.A.B)

# Configurações de Reprodução e Dados
random_seed: 42
bag_size: 200
n_bags_uniform: 250
n_bags_extreme: 250

# Estratégia
strategy: "LQL"

# Modelos a serem testados
# Certifique-se de que os nomes correspondem aos mapeamentos no script Python
classifiers:
  # - "rf"
  # - "lr"
  - "svm"

quantifiers:
  - "cc"
  - "pcc"
  - "ac"
  - "pacc"
  - "hdy"
  - "dfy"
  - "em"
  - "edy"